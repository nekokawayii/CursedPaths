plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'cn.blockforge.generated.nnnnr1201forge2'
version = '1.8.1-original-textures-r375-1.21.1'
base { archivesName = "jujutsu-kaisen-cursed-paths-neoforge-1.21.1" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    flatDir { dirs 'libs' }
}

neoForge {
    version = '21.1.265'
    runs {
        client { client() }
        server { server() }
    }
}

dependencies {
    // 必需前置：Photon（NeoForge 1.21.1）
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    runtimeOnly fileTree(dir: 'libs', include: ['*.jar'])
}

processResources {
    inputs.property 'version', project.version
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand mod_id: 'jujutsu_kaisen_cursed_paths',
               mod_name: '咒命歧路',
               mod_version: project.version,
               loader_version: '[4,)'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '3000'
}
